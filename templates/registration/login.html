{% extends 'base.html' %}{% block content %}<div class="form-caja login"><p class="subtitulo">ACCESO INSTITUCIONAL SIMULADO</p><h1>Iniciar sesión</h1><p>Utiliza las credenciales de prueba creadas localmente.</p><form method="post">{% csrf_token %}{% if form.errors %}<div role="alert" class="alerta error">Usuario o contraseña incorrectos.</div>{% endif %}<div class="campo"><label for="id_username">Usuario</label>{{ form.username }}</div><div class="campo"><label for="id_password">Contraseña</label>{{ form.password }}</div><input type="hidden" name="next" value="{{ next }}"><button type="submit" class="boton ancho">Ingresar</button></form></div>{% endblock %}
